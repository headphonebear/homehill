# ║                                                                            ║
# ║ TO ROTATE/RESEAL (new token in Forgejo as `orchard` first):                 ║
# ║     kubectl create secret docker-registry ingestor-registry \               ║
# ║       --namespace=ingestor --docker-server=git.homehill.de \               ║
# ║       --docker-username=orchard --docker-password="$TOKEN" \               ║
# ║       --dry-run=client -o yaml \                                            ║
# ║       | kubeseal --controller-name sealed-secrets -o yaml                  ║
# ║ Strict scope: decrypts only as `ingestor-registry` in namespace `ingestor`. ║
# ╚════════════════════════════════════════════════════════════════════════════╝
