# ║ 🔐 Registry pull secret — SealedSecret                                      ║
# ║ kubernetes.io/dockerconfigjson for git.homehill.de, used by the CronJobs    ║
# ║ as imagePullSecrets (values.yaml image.pullSecret = ingestor-registry).     ║
# ║                                                                            ║
# ║ WHO: Forgejo user `orchard` — member of team `puller` in org `homehill`     ║
# ║ (Packages: Read, nothing else). Token `orchard-pull`, scope package:read    ║
# ║ ONLY. Plaintext in Vaultwarden. Sealed 2026-10-20 by coder.                 ║
