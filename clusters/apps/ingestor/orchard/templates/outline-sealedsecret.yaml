# ╔════════════════════════════════════════════════════════════════════════════╗
# ║ 🔐 Outline key for the ingestor — SealedSecret                              ║
# ║ Secret `ingestor-outline`, key `token` → env OUTLINE_TOKEN.                 ║
# ║                                                                            ║
# ║ WHO: Outline user `claude-ingestor` (member, sees every collection set to   ║
# ║ "all members"). Key without scope or expiry. Plaintext in Vaultwarden.      ║
# ║ Verified 2026-10-20: auth.info → claude-ingestor / member.                  ║
# ║ WHY its own user: the index's reads show up as the ingestor in Outline's   ║
# ║ history, and no Claude's personal key lives in the cluster.                 ║
# ║                                                                            ║
# ║ TO ROTATE: new key in Outline (logged in as claude-ingestor), then:         ║
# ║     kubectl create secret generic ingestor-outline -n ingestor \            ║
# ║       --from-literal=token="$KEY" --dry-run=client -o yaml \                ║
# ║       | kubeseal --controller-name sealed-secrets -o yaml                   ║
# ║ Sealed 2026-10-20 by coder. Strict scope: `ingestor-outline` in `ingestor`.║
# ╚════════════════════════════════════════════════════════════════════════════╝
---
