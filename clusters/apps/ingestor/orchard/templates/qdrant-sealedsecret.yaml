# ╔════════════════════════════════════════════════════════════════════════════╗
# ║ 🔐 Qdrant key for the ingestor — SealedSecret                               ║
# ║ Secret `ingestor-qdrant`, key `api-key` → env QDRANT_API_KEY.               ║
# ║                                                                            ║
# ║ WHAT: a Qdrant JWT (HS256, signed with the master API key), claims          ║
# ║   {"access":[{"collection":"outline-docs","access":"rw"}]}, no expiry.      ║
# ║ Needs QDRANT__SERVICE__JWT_RBAC=true (qdrant values.yaml, 2026-10-20).      ║
# ║ Verified 2026-10-20: outline-docs count/delete ✅; claude-memory 403,        ║
# ║ collection delete 403, /collections lists ONLY outline-docs.                ║
# ║ WHY not the master key: the job can't create/drop collections and can't    ║
# ║ see claude-memory. A JWT signed with the master key dies with it — rotate   ║
# ║ the master key and every JWT must be re-minted and re-sealed.               ║
# ║                                                                            ║
# ║ TO RE-MINT: sign the claims above with the master key (HS256, any JWT lib), ║
# ║ then:  kubectl create secret generic ingestor-qdrant -n ingestor \          ║
# ║          --from-literal=api-key="$JWT" --dry-run=client -o yaml \           ║
# ║          | kubeseal --controller-name sealed-secrets -o yaml                ║
# ║ Sealed 2026-10-20 by coder. Strict scope: `ingestor-qdrant` in `ingestor`. ║
# ╚════════════════════════════════════════════════════════════════════════════╝
---
