# ╔════════════════════════════════════════════════════════════════════════════╗
# ║ CloudNativePG Operator — values                                          ║
# ║ Values are keyed under the dependency name `cloudnative-pg`.              ║
# ║ We lean on chart defaults; only homelab-relevant knobs are set here.      ║
# ╚════════════════════════════════════════════════════════════════════════════╝

cloudnative-pg:
  # ── Operator replicas ──────────────────────────────────────────────────────
  replicaCount: 1
  # WHY: A single operator replica is plenty for a 3-node homelab. The operator
  # is a control-plane controller, not on the data path — if its pod restarts,
  # running Postgres clusters keep serving. HA operator (2+) buys us nothing here
  # and would just burn RAM on the N150 nodes.

  # ── CRDs ────────────────────────────────────────────────────────────────────
  crds:
    create: true
    # WHY: Let the chart install/manage the CNPG CRDs. Note: these CRDs are large
    # — see the ServerSideApply syncOption on the Application manifest, same class
    # of "exceeds the 262KB client-side annotation limit" problem as monitoring.

  # ── Metrics ─────────────────────────────────────────────────────────────────
  monitoring:
    podMonitorEnabled: false
    # WHY: This toggles a PodMonitor for the OPERATOR itself. We keep it off for
    # now — the metrics that matter are per-database, configured on each `Cluster`
    # CR (memos will enable its own). Revisit if we want operator-level dashboards.

  # ── Resources ───────────────────────────────────────────────────────────────
  resources:
    requests:
      cpu: 50m
      memory: 100Mi
    limits:
      memory: 200Mi
    # WHY: The controller is lightweight. Modest requests keep it honest on the
    # 16GB nodes; a memory limit (no CPU limit, to avoid throttling reconciles)
    # guards against runaway growth.

  # ── Operator configuration ──────────────────────────────────────────────────
  config:
    data:
      ENABLE_INSTANCE_MANAGER_INPLACE_UPDATES: "true"
      # WHY: By default every OPERATOR upgrade rolls every Postgres pod: the new
      # instance manager arrives via an init container. All our clusters have ONE
      # instance, so "roll" means "restart without switchover", and a restart
      # waits up to smartShutdownTimeout for clients to hang up. On 2026-11-12
      # the chart bump 0.29.0 → 0.29.1 (Renovate #76) took hive, isley, memos
      # and vaultwarden offline for ~3 min each, all at once, unannounced.
      # With in-place updates the operator swaps the instance-manager binary
      # inside the running pod and it adopts the running postmaster, so
      # Postgres keeps serving (docs: installation_upgrade.md, "In-place updates
      # of the instance manager", v1.30.1).
      # TRADE-OFF: pods change after start (not strictly immutable), and the
      # init-container image in the pod spec no longer shows the operator
      # version. Fine for a homelab; we read the version from the operator.
      # ROLLOUT: changing this ConfigMap restarts only the operator pod
      # (checksum/config annotation). Databases are not touched.
