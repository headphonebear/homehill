# ╔════════════════════════════════════════════════════════════════════════════╗
# ║ emoji-tray IngressRoute — https://emoji.homehill.de                         ║
# ║ Repo convention: HTTP→HTTPS redirect + HTTPS route, *.homehill.de wildcard. ║
# ║ Internal-only. Pi-hole needs the A-record emoji.homehill.de → apple (.50).  ║
# ║                                                                            ║
# ║ WHY HTTPS matters here beyond habit: click-to-copy uses the Clipboard API,  ║
# ║ which browsers only allow in a secure context (https or localhost). Over    ║
# ║ plain http the app falls back to the deprecated execCommand("copy").        ║
# ╚════════════════════════════════════════════════════════════════════════════╝
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: emoji-tray-http
  namespace: emoji-tray
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`emoji.homehill.de`)
      kind: Rule
      middlewares:
        - name: redirect-https
          namespace: traefik
      services:
        - name: emoji-tray
          port: 8080
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: emoji-tray-https
  namespace: emoji-tray
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`emoji.homehill.de`)
      kind: Rule
      services:
        - name: emoji-tray
          port: 8080
  tls:
    secretName: homehill-wildcard-tls
