# ╔════════════════════════════════════════════════════════════════════════════╗
# ║ ArgoCD Orchard Configuration - Homehill Edition                            ║
# ║ Based on ArgoCD Helm Chart v10.2.2 (ArgoCD v3.4.6)                         ║
# ║                                                                            ║
# ║ IMPORTANT NOTES:                                                           ║
# ║ - This config is for the PUBLIC homehill repo (no SSH keys needed)         ║
# ║ - Domain: argocd.homehill.de (Pi-hole DNS + wildcard LE cert)              ║
# ║ - Exposed via Traefik IngressRoute (templates/ingressroute.yaml)           ║
# ║ - ArgoCD manages itself (clusters/argocd/orchard/argocd.yaml)              ║
# ╚════════════════════════════════════════════════════════════════════════════╝

# NOTE (2026-10-10): a top-level `namespaceOverride: "argocd"` used to sit here.
# It sat OUTSIDE the `argo-cd:` key, so the subchart never saw it — the namespace
# comes from the Application's destination (argocd). Removed as dead config.

# ╔════════════════════════════════════════════════════════════════════════════╗
# ║ Global Configuration                                                       ║
# ╚════════════════════════════════════════════════════════════════════════════╝

global:
  domain: 'argocd.homehill.de'
  # WHY: Used by the chart for server URLs/links. `global:` is the one top-level
  # block Helm DOES pass down to subcharts.

  securityContext:
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999
  # WHY: Pod-level security context for ALL ArgoCD components
  # This ensures:
  # 1. Pods run as argocd user (uid=999, gid=999)
  # 2. Any mounted volumes inherit fsGroup ownership
  # 3. Future SSH keys (if needed) will be readable by the argocd user

  networkPolicy:
    create: true
  # WHY: chart 10.0.0 made this the default (upstream best practice): the first
  # NetworkPolicies on Orchard (k3s enforces them via its embedded kube-router).
  # Kept OFF for the 3.4 bump on 2026-10-10 (one change at a time), enabled in
  # its own commit right after. What they allow (ingress only, egress untouched):
  #   argocd-server      ← anyone (Traefik, port-forward)
  #   argocd-repo-server ← server, application-controller, applicationset-controller
  #   argocd-redis       ← server, repo-server, application-controller
  #   argocd-dex-server  ← server (http/grpc); metrics from any namespace
  #   application-ctrl   ← metrics port only (nobody else needs to call it)
  # ROLLBACK if ArgoCD can't reach itself (it then can't sync its own fix!):
  #   kubectl -n argocd delete networkpolicy --all   # break-glass, then revert here

# ╔════════════════════════════════════════════════════════════════════════════╗
# ║ Main ArgoCD Chart Configuration (everything under argo-cd)                 ║
# ╚════════════════════════════════════════════════════════════════════════════╝

argo-cd:
  # ╔────────────────────────────────────────────────────────────────────────╗
  # ║ ArgoCD Core Configuration (via ConfigMap)                              ║
  # ║ Helm renders this into the argocd-cm ConfigMap                         ║
  # ╚────────────────────────────────────────────────────────────────────────╝

  configs:
    params:
      server.insecure: true
      # WHY: TLS terminates at Traefik; argocd-server speaks plain HTTP behind it.
      # (This is the server.insecure that actually takes effect.)

    cm:
      # WHY: This tells ArgoCD where to find the Git repository for syncing
      # The homehill repo is PUBLIC, so no authentication is needed
      # ArgoCD will clone via HTTPS without credentials
      repositories: |
        - url: https://github.com/headphonebear/homehill.git
          type: git
          name: homehill

      # WHY: Set reconciliation timeout to 60s (default is 180s)
      # Prevents "Unknown" status for repos with many resources
      timeout.reconciliation: 60s

      # WHY: Server URL - used in notifications, links, CLI login, etc.
      # This should match the actual URL users will access ArgoCD at
      url: https://argocd.homehill.de

      # ┌──────────────────────────────────────────────────────────────────┐
      # │ Custom Resource Health Checks for cert-manager                       │
      # └──────────────────────────────────────────────────────────────────┘
      # WHY: ArgoCD doesn't know how to check health of cert-manager resources
      # by default. Without this, Certificate and Issuer resources stay in
      # "Progressing" state forever, even when they're actually healthy.
      # This Lua script teaches ArgoCD to read cert-manager's status conditions.
      resource.customizations: |
        cert-manager.io/Certificate:
          health.lua: |
            hs = {}
            if obj.status ~= nil then
              if obj.status.conditions ~= nil then
                for i, condition in ipairs(obj.status.conditions) do
                  if condition.type == "Ready" and condition.status == "False" then
                    hs.status = "Degraded"
                    hs.message = condition.message
                    return hs
                  end
                  if condition.type == "Ready" and condition.status == "True" then
                    hs.status = "Healthy"
                    hs.message = condition.message
                    return hs
                  end
                end
              end
            end
            hs.status = "Progressing"
            hs.message = "Waiting for certificate"
            return hs
        cert-manager.io/ClusterIssuer:
          health.lua: |
            hs = {}
            if obj.status ~= nil then
              if obj.status.conditions ~= nil then
                for i, condition in ipairs(obj.status.conditions) do
                  if condition.type == "Ready" and condition.status == "False" then
                    hs.status = "Degraded"
                    hs.message = condition.message
                    return hs
                  end
                  if condition.type == "Ready" and condition.status == "True" then
                    hs.status = "Healthy"
                    hs.message = condition.message
                    return hs
                  end
                end
              end
            end
            hs.status = "Progressing"
            hs.message = "Waiting for issuer to be ready"
            return hs
        cert-manager.io/Issuer:
          health.lua: |
            hs = {}
            if obj.status ~= nil then
              if obj.status.conditions ~= nil then
                for i, condition in ipairs(obj.status.conditions) do
                  if condition.type == "Ready" and condition.status == "False" then
                    hs.status = "Degraded"
                    hs.message = condition.message
                    return hs
                  end
                  if condition.type == "Ready" and condition.status == "True" then
                    hs.status = "Healthy"
                    hs.message = condition.message
                    return hs
                  end
                end
              end
            end
            hs.status = "Progressing"
            hs.message = "Waiting for issuer to be ready"
            return hs

  # ╔────────────────────────────────────────────────────────────────────────╗
  # ║ Redis Configuration                                                    ║
  # ╚────────────────────────────────────────────────────────────────────────╝

  redis:
    # WHY: Use the built-in Redis for caching and session storage
    # This is the standard setup for small-to-medium clusters
    enabled: true

  # ╔────────────────────────────────────────────────────────────────────────╗
  # ║ CRD Installation                                                       ║
  # ╚────────────────────────────────────────────────────────────────────────╝

  crds:
    # WHY: Let Helm install ArgoCD CRDs (Application, ApplicationSet, AppProject)
    # Without these, ArgoCD cannot function - they define the core resource types
    install: true

  # ╔────────────────────────────────────────────────────────────────────────╗
  # ║ ArgoCD Server Configuration                                            ║
  # ╚────────────────────────────────────────────────────────────────────────╝

  server:
    service:
      # WHY: ClusterIP (internal only) — exposed via the Traefik IngressRoute
      # in templates/ingressroute.yaml. No LoadBalancer needed.
      type: ClusterIP

    ingress:
      # WHY: We use a Traefik IngressRoute CRD (templates/ingressroute.yaml),
      # not a Kubernetes Ingress — so the chart's own Ingress stays off.
      enabled: false

  # ╔────────────────────────────────────────────────────────────────────────╗
  # ║ ArgoCD Controller Configuration                                        ║
  # ╚────────────────────────────────────────────────────────────────────────╝

  controller:
    # WHY: Single replica for now (homelab setup)
    # Can be scaled to 3+ for HA in production scenarios
    replicas: 1

  # ╔────────────────────────────────────────────────────────────────────────╗
  # ║ Repo Server Configuration                                              ║
  # ║ This component clones Git repos and generates manifests                ║
  # ╚────────────────────────────────────────────────────────────────────────╝

  repoServer:
    # ┌────────────────────────────────────────────────────────────────────────┐
    # │ SSH KEY VOLUMES - NOT NEEDED for public repos                          │
    # │ Kept here as documentation in case private repos are added later       │
    # └────────────────────────────────────────────────────────────────────────┘

    # volumes:
    #   - name: github-ssh
    #     secret:
    #       secretName: github-ssh
    #       defaultMode: 0400
    #       items:
    #         - key: sshPrivateKey
    #           path: id_ed25519
    #           mode: 0400

    # volumeMounts:
    #   - name: github-ssh
    #     mountPath: /home/argocd/.ssh
    #     readOnly: true

    # WHY: Resource requests/limits ensure fair resource sharing on the cluster
    # Prevents repo-server from consuming all node resources during large syncs
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

  # ╔────────────────────────────────────────────────────────────────────────╗
  # ║ Dead config removed 2026-10-10 (never read by the chart)                ║
  # ╚────────────────────────────────────────────────────────────────────────╝
  # Found while rendering the 3.4 upgrade: these keys don't exist in the argo-cd
  # chart, so the rendered manifests were identical with or without them.
  # - `params:` (top of argo-cd) — real home is `configs.params`; the value
  #   (application.instanceLabelKey) is the chart default anyway.
  # - `server.insecure` — the setting that works is configs.params.server.insecure.
  # - `applicationController.metrics` — real key is `controller.metrics`. Metrics
  #   are therefore OFF today; enabling them (+ ServiceMonitor) is a monitoring todo.
  # - `rbac.policyDefault/policyRules` — real home is `configs.rbac`. The rendered
  #   argocd-rbac-cm was EMPTY all along. Fine today: the only account is the
  #   built-in `admin`, which has the built-in role:admin. More users → configs.rbac.

  # ╔────────────────────────────────────────────────────────────────────────╗
  # ║ Notification & Webhook Settings                                        ║
  # ╚────────────────────────────────────────────────────────────────────────╝

  notifications:
    # WHY: Disabled for now - can be enabled later for Slack/Discord/email alerts
    # When enabled, ArgoCD can notify on sync failures, health changes, etc.
    enabled: false

# ╔════════════════════════════════════════════════════════════════════════════╗
# ║ NOTES FOR FUTURE ENHANCEMENTS                                              ║
# ╚════════════════════════════════════════════════════════════════════════════╝

# NOTE: argocd-image-updater available for automated image updates
# Consider enabling once cluster is stable (6+ months) and monitoring is in place
# Trade-off: Convenience vs. Control - homelab benefits from manual updates
