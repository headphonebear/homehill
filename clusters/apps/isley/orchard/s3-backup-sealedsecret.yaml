# ╔════════════════════════════════════════════════════════════════════════════╗
# ║ 🔐 Isley DB S3 backup credentials — SealedSecret                           ║
# ║ Hetzner Object Storage keys (bucket `bearbackups`) that CNPG's Barman uses   ║
# ║ to push WAL + base backups. Referenced by database.yaml.                    ║
# ║                                                                            ║
# ║ SEALED — encryptedData below is the real, cluster-encrypted key pair         ║
# ║ (sealed 2026-07-17 against the sealed-secrets controller). These are         ║
# ║ dedicated, per-backup credentials for exactly this bucket prefix — freshly    ║
# ║ minted so revoking them can't hurt any other backup.                         ║
# ║                                                                            ║
# ║ TO ROTATE/RESEAL (blast radius = secrets):                                  ║
# ║   kubectl create secret generic isley-db-s3-backup -n isley \                ║
# ║     --from-literal=ACCESS_KEY_ID=... --from-literal=ACCESS_SECRET_KEY=... \   ║
# ║     --dry-run=client -o yaml \                                              ║
# ║   | kubeseal --controller-name=sealed-secrets \                             ║
# ║       --controller-namespace=kube-system --format=yaml                       ║
# ║   # paste the new encryptedData here. (NB: controller is `sealed-secrets`,    ║
# ║   #  NOT `sealed-secrets-controller` — pass the flags or it "can't find" it.) ║
# ║                                                                            ║
# ║ Name+namespace-scoped (strict): only decrypts as `isley-db-s3-backup`        ║
# ║ in namespace `isley`.                                                        ║
# ╚════════════════════════════════════════════════════════════════════════════╝
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  creationTimestamp: null
  name: isley-db-s3-backup
  namespace: isley
spec:
  encryptedData:
    ACCESS_KEY_ID: 
    ACCESS_SECRET_KEY: 
  template:
    metadata:
      creationTimestamp: null
      name: isley-db-s3-backup
      namespace: isley
