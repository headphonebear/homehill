# ╔════════════════════════════════════════════════════════════════════════════╗
# ║ 🔐 Isley session secret — SealedSecret                                     ║
# ║ Signs Isley's session cookies (ISLEY_SESSION_SECRET). 48 bytes of openssl    ║
# ║ entropy, well above the ≥32-byte production floor. Referenced by the         ║
# ║ Deployment as an env var.                                                    ║
# ║                                                                            ║
# ║ SEALED — encryptedData below is cluster-encrypted (sealed 2026-07-17).       ║
# ║ Isley is its OWN source of truth here: this key exists ONLY encrypted in Git ║
# ║ and decrypted in-cluster — it is not stored in Vaultwarden. Rotating it just  ║
# ║ invalidates live sessions (everyone re-logs in), no data loss.               ║
# ║                                                                            ║
# ║ TO ROTATE/RESEAL (blast radius = a forced re-login):                        ║
# ║   kubectl create secret generic isley-session -n isley \                     ║
# ║     --from-literal=ISLEY_SESSION_SECRET="$(openssl rand -base64 48)" \        ║
# ║     --dry-run=client -o yaml \                                              ║
# ║   | kubeseal --controller-name=sealed-secrets \                             ║
# ║       --controller-namespace=kube-system --format=yaml                       ║
# ║                                                                            ║
# ║ Name+namespace-scoped (strict): only decrypts as `isley-session` in `isley`. ║
# ╚════════════════════════════════════════════════════════════════════════════╝
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  creationTimestamp: null
  name: isley-session
  namespace: isley
spec:
  encryptedData:
    ISLEY_SESSION_SECRET: 
  template:
    metadata:
      creationTimestamp: null
      name: isley-session
      namespace: isley
