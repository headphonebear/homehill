# ╔════════════════════════════════════════════════════════════════════════════╗
# ║ Isley IngressRoute — https://isley.homehill.de                             ║
# ║ Repo convention (see vaultwarden/memos/longhorn): an HTTP→HTTPS redirect     ║
# ║ plus the HTTPS route, TLS via the shared wildcard cert (default TLSStore).   ║
# ║                                                                            ║
# ║ Internal-only (homehill.de, behind the router). Pi-hole holds the A-record   ║
# ║ isley.homehill.de → apple (192.168.1.50).                                    ║
# ╚════════════════════════════════════════════════════════════════════════════╝
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: isley-http
  namespace: isley
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`isley.homehill.de`)
      kind: Rule
      middlewares:
        - name: redirect-https
          namespace: traefik
          # WHY: shared redirect middleware, same one vaultwarden/memos/longhorn use.
      services:
        - name: isley
          port: 8080
          # WHY 8080 (not 80): our Service exposes the container's 8080 directly —
          # unlike the vaultwarden subchart's Service which remapped to 80.
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: isley-https
  namespace: isley
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`isley.homehill.de`)
      kind: Rule
      services:
        - name: isley
          port: 8080
  tls:
    secretName: homehill-wildcard-tls
    # WHY: the *.homehill.de wildcard (issued by cert-manager into the traefik ns,
    # exposed via the default TLSStore). Same reference every other app uses — no
    # per-namespace copy needed.
