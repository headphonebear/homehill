# ╔════════════════════════════════════════════════════════════════════════════╗
# ║ cert-manager Umbrella Chart for Orchard                                   ║
# ║ Automated TLS certificate management via Let's Encrypt                    ║
# ║ INCLUDES: Support for DNS-01 challenges (for *.homehill.de wildcard)      ║
# ╚════════════════════════════════════════════════════════════════════════════╝

apiVersion: v2
name: cert-manager-orchard
description: Automated TLS certificate management for Orchard cluster at Homehill
type: application
version: 1.0.0
appVersion: "1.21.2"
# WHY: appVersion matches cert-manager's actual version

dependencies:
  - name: cert-manager
    repository: https://charts.jetstack.io
    version: "1.21.2"
    # WHY: Official cert-manager Helm chart
    # WHY 1.21.x: supports K8s 1.33-1.36 (needed before Orchard moves to 1.36).
    # Upstream recommends ONE minor version per upgrade — reached via 1.20.4
    # on 2026-10-10. 1.21 removed prometheus.servicemonitor.targetPort/path
    # (schema rejects them) — don't re-add them to values.yaml.
    # Handles Let's Encrypt certificate issuance, renewal, and management

# NOTE: The Hetzner DNS-01 webhook is its own Application
# (clusters/apps/cert-manager-webhook-hetzner/ + clusters/argocd/orchard/cert-manager-webhook-hetzner.yaml).
# WHY separate: it must be installed AFTER cert-manager's CRDs/webhook are running.
