# ╔════════════════════════════════════════════════════════════════════════════╗
# ║ 🔐 Hive admin user — SealedSecret                                          ║
# ║ Delivers the Forgejo admin credentials the chart reads via                  ║
# ║ gitea.admin.existingSecret (secret `hive-admin`, keys `username`/`password`).║
# ║ The chart runs `forgejo admin user create` from these on first boot.        ║
# ║                                                                            ║
# ║ SEALED — the encryptedData below is the real, cluster-encrypted credential  ║
# ║ pair (sealed 2026-09-23). The plaintext password lives in Vaultwarden and   ║
# ║ nowhere else; Git never saw it.                                             ║
# ║                                                                            ║
# ║ TO ROTATE/RESEAL (blast radius = secrets, so Stefan runs it):              ║
# ║     PW=$(openssl rand -base64 24)                                          ║
# ║     kubectl create secret generic hive-admin --namespace=hive \             ║
# ║       --from-literal=username=bear --from-literal=password="$PW" \          ║
# ║       --dry-run=client -o yaml \                                           ║
# ║     | kubeseal --controller-name=sealed-secrets \                          ║
# ║         --controller-namespace=kube-system --format=yaml                    ║
# ║     # paste the resulting encryptedData below, and put $PW into Vaultwarden. ║
# ║     # (NB: controller is `sealed-secrets`, NOT `sealed-secrets-controller` — ║
# ║     #  pass the flags or kubeseal "can't find" it.)                         ║
# ║                                                                            ║
# ║ Name+namespace-scoped (strict): only decrypts as `hive-admin` in `hive`.    ║
# ╚════════════════════════════════════════════════════════════════════════════╝
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  creationTimestamp: null
  name: hive-admin
  namespace: hive
spec:
  encryptedData:
    username: 
    password: 
  template:
    metadata:
      creationTimestamp: null
      name: hive-admin
      namespace: hive
    type: Opaque
