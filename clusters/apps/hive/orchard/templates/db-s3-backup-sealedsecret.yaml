# ╔════════════════════════════════════════════════════════════════════════════╗
# ║ 🔐 Hive DB S3 backup credentials — SealedSecret                            ║
# ║ Hetzner Object Storage keys (bucket `bearbackups`) that CNPG's Barman uses  ║
# ║ to push WAL + base backups. Referenced by templates/database.yaml.          ║
# ║                                                                            ║
# ║ SEALED — the encryptedData below is the real, cluster-encrypted key pair    ║
# ║ (sealed 2026-09-23), the same scoped Hetzner credentials the other apps     ║
# ║ use, re-sealed for this name+namespace.                                     ║
# ║                                                                            ║
# ║ TO ROTATE/RESEAL:                                                          ║
# ║     kubectl create secret generic hive-db-s3-backup -n hive \               ║
# ║       --from-literal=ACCESS_KEY_ID=... --from-literal=ACCESS_SECRET_KEY=... \║
# ║       --dry-run=client -o yaml \                                           ║
# ║     | kubeseal --controller-name=sealed-secrets \                          ║
# ║         --controller-namespace=kube-system --format=yaml                    ║
# ║     # paste the resulting encryptedData below.                              ║
# ║                                                                            ║
# ║ ⚠️  You cannot copy vaultwarden's sealed blob here: SealedSecrets are       ║
# ║     name+namespace-scoped (strict). Same plaintext, but it must be sealed   ║
# ║     again as `hive-db-s3-backup` in namespace `hive`.                       ║
# ╚════════════════════════════════════════════════════════════════════════════╝
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  creationTimestamp: null
  name: hive-db-s3-backup
  namespace: hive
spec:
  encryptedData:
    ACCESS_KEY_ID: 
    ACCESS_SECRET_KEY: 
  template:
    metadata:
      creationTimestamp: null
      name: hive-db-s3-backup
      namespace: hive
    type: Opaque
