# ╔════════════════════════════════════════════════════════════════════════════╗
# ║ 🔐 Qdrant API key — SealedSecret                                           ║
# ║ Delivers the single API key the subchart reads via valueFrom.secretKeyRef   ║
# ║ (secret `qdrant-api-key`, key `api-key`).                                    ║
# ║                                                                            ║
# ║ SEALED — the encryptedData below is the real, cluster-encrypted key         ║
# ║ (sealed 2026-07-15 against the sealed-secrets controller). The matching      ║
# ║ plaintext lives only in Stefan's keeping — it must ALSO go into the clients: ║
# ║ ingestor QDRANT_API_KEY + the qdrant MCP server. Same key both ends.         ║
# ║                                                                            ║
# ║ TO ROTATE/RESEAL (blast radius = secrets, so Stefan runs it):               ║
# ║     KEY=$(openssl rand -base64 32)                                          ║
# ║     kubeseal --controller-name sealed-secrets --fetch-cert > cert.pem       ║
# ║     kubectl create secret generic qdrant-api-key --namespace=qdrant \        ║
# ║       --from-literal=api-key="$KEY" --dry-run=client -o yaml \               ║
# ║       | kubeseal --cert cert.pem -o yaml                                     ║
# ║     # paste the new encryptedData here, update $KEY in both clients.          ║
# ║                                                                            ║
# ║ WHY committed as a placeholder: keeps the chart complete + documents the     ║
# ║ exact recipe at the point of use. SealedSecrets are name+namespace scoped    ║
# ║ (strict) — this only decrypts as `qdrant-api-key` in namespace `qdrant`.     ║
# ╚════════════════════════════════════════════════════════════════════════════╝
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  creationTimestamp: null
  name: qdrant-api-key
  namespace: qdrant
spec:
  encryptedData:
    api-key: 
  template:
    metadata:
      creationTimestamp: null
      name: qdrant-api-key
      namespace: qdrant
    type: Opaque
