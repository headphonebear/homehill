# ╔════════════════════════════════════════════════════════════════════════════╗
# ║ 🔐 Manyfold SECRET_KEY_BASE — SealedSecret                                 ║
# ║ Rails' master signing key (sessions, cookies, signed IDs). 64 bytes of       ║
# ║ openssl entropy as 128 hex chars — the format upstream documents ("normally  ║
# ║ a 128-digit hexadecimal number"). Referenced by the Deployment as env var.   ║
# ║                                                                            ║
# ║ SEALED — encryptedData below is cluster-encrypted (sealed 2026-11-04).       ║
# ║ Manyfold is its OWN source of truth here (same call as isley's session      ║
# ║ key): exists ONLY encrypted in Git + decrypted in-cluster, not in            ║
# ║ Vaultwarden. Rotating it just logs everyone out — no data loss.              ║
# ║                                                                            ║
# ║ TO ROTATE/RESEAL (blast radius = a forced re-login):                        ║
# ║   kubectl create secret generic manyfold-secret-key -n manyfold \           ║
# ║     --from-literal=SECRET_KEY_BASE="$(openssl rand -hex 64)" \              ║
# ║     --dry-run=client -o yaml \                                              ║
# ║   | kubeseal --controller-name=sealed-secrets \                             ║
# ║       --controller-namespace=kube-system --format=yaml                       ║
# ║                                                                            ║
# ║ Name+namespace-scoped (strict): only decrypts as `manyfold-secret-key` in   ║
# ║ `manyfold`.                                                                  ║
# ╚════════════════════════════════════════════════════════════════════════════╝
---
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  creationTimestamp: null
  name: manyfold-secret-key
  namespace: manyfold
spec:
  encryptedData:
    SECRET_KEY_BASE: 
  template:
    metadata:
      creationTimestamp: null
      name: manyfold-secret-key
      namespace: manyfold
