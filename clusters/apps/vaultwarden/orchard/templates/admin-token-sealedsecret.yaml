# ╔════════════════════════════════════════════════════════════════════════════╗
# ║ 🔐 Vaultwarden admin token — SealedSecret                                  ║
# ║ Gates the /admin panel (user invites, settings). Referenced by the subchart  ║
# ║ via adminToken.existingSecret=vaultwarden-admin, existingSecretKey=token.    ║
# ║                                                                            ║
# ║ SEALED — encryptedData below is a strong random token, cluster-encrypted     ║
# ║ (generated + sealed 2026-07-16). The plaintext is needed for the FIRST       ║
# ║ /admin login; after the vault is live it should live IN Vaultwarden itself   ║
# ║ (the vault is the source of truth for plaintext — Git only holds the sealed  ║
# ║ copy). Rotate any time by resealing below.                                   ║
# ║                                                                            ║
# ║ TO ROTATE/RESEAL:                                                           ║
# ║   TOKEN=$(openssl rand -base64 48)                                          ║
# ║   kubectl create secret generic vaultwarden-admin -n vaultwarden \           ║
# ║     --from-literal=token="$TOKEN" --dry-run=client -o yaml \                 ║
# ║   | kubeseal --controller-name=sealed-secrets \                             ║
# ║       --controller-namespace=kube-system --format=yaml                       ║
# ║   # paste the new encryptedData here, update the token in the vault.          ║
# ╚════════════════════════════════════════════════════════════════════════════╝
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  creationTimestamp: null
  name: vaultwarden-admin
  namespace: vaultwarden
spec:
  encryptedData:
    token: 
  template:
    metadata:
      creationTimestamp: null
      name: vaultwarden-admin
      namespace: vaultwarden
    type: Opaque
