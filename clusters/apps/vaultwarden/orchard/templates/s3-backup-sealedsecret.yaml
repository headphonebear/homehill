# ╔════════════════════════════════════════════════════════════════════════════╗
# ║ 🔐 Vaultwarden DB S3 backup credentials — SealedSecret                     ║
# ║ Hetzner Object Storage keys (bucket `bearbackups`) that CNPG's Barman uses   ║
# ║ to push WAL + base backups. Referenced by templates/database.yaml.          ║
# ║                                                                            ║
# ║ SEALED — encryptedData below is the real, cluster-encrypted key pair         ║
# ║ (sealed 2026-07-16 against the sealed-secrets controller). These are         ║
# ║ dedicated, scoped credentials for exactly this backup — nothing else.        ║
# ║                                                                            ║
# ║ TO ROTATE/RESEAL (blast radius = secrets):                                  ║
# ║   kubectl create secret generic vaultwarden-db-s3-backup -n vaultwarden \    ║
# ║     --from-literal=ACCESS_KEY_ID=... --from-literal=ACCESS_SECRET_KEY=... \   ║
# ║     --dry-run=client -o yaml \                                              ║
# ║   | kubeseal --controller-name=sealed-secrets \                             ║
# ║       --controller-namespace=kube-system --format=yaml                       ║
# ║   # paste the new encryptedData here. (NB: controller is `sealed-secrets`,    ║
# ║   #  NOT `sealed-secrets-controller` — pass the flags or it "can't find" it.) ║
# ║                                                                            ║
# ║ Name+namespace-scoped (strict): only decrypts as `vaultwarden-db-s3-backup`  ║
# ║ in namespace `vaultwarden`.                                                  ║
# ╚════════════════════════════════════════════════════════════════════════════╝
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  creationTimestamp: null
  name: vaultwarden-db-s3-backup
  namespace: vaultwarden
spec:
  encryptedData:
    ACCESS_KEY_ID: 
    ACCESS_SECRET_KEY: 
  template:
    metadata:
      creationTimestamp: null
      name: vaultwarden-db-s3-backup
      namespace: vaultwarden
    type: Opaque
