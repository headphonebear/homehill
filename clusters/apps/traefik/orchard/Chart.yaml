# ╔════════════════════════════════════════════════════════════════════════════╗
# ║ Traefik Umbrella Chart for Orchard                                         ║
# ║ Single Traefik instance with CRDs for IngressRoute/Middleware support      ║
# ║ PATTERN: Umbrella chart wrapping official Traefik chart v39.0.9            ║
# ╚════════════════════════════════════════════════════════════════════════════╝

apiVersion: v2
name: traefik-orchard
description: Traefik Ingress Controller for Orchard cluster at Homehill
type: application
version: 1.0.0
appVersion: "3.6.15"
# WHY: appVersion matches Traefik's actual version (v3.6.15 in chart 39.0.9).
# Check after every chart bump: `helm template` → grep the traefik image tag.
# (Until 2026-11-12 this still said 3.2.1 although chart 39.0.0 shipped 3.6.7.)

dependencies:
  - name: traefik
    repository: https://traefik.github.io/charts
    version: 39.0.9
    # WHY: Official Traefik Helm chart

  - name: traefik-crds
    repository: https://traefik.github.io/charts
    version: 1.14.1
    # WHY: Traefik Custom Resource Definitions (IngressRoute, Middleware, etc.)
    # Deployed as their own chart so they upgrade with the umbrella.
    #
    # ⚠️ The CRD chart version must MATCH the traefik chart line. Upstream
    # publishes them together: traefik 39.0.9 ↔ crds 1.14.1, while crds
    # 1.15–1.18 came out with the v40 line. Renovate cannot know this and
    # proposes the newest CRDs as a harmless "minor" (2026-11-12: PR #87,
    # 1.14 → 1.18). Take a CRD bump together with its traefik chart, never
    # alone. Pairs: GitHub traefik/traefik-helm-chart releases (crds_v* tags).
