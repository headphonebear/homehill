{{- if .Values.app.enabled }}
# ╔════════════════════════════════════════════════════════════════════════════╗
# ║ Memos IngressRoute — https://memos.homehill.de                            ║
# ║ Mirrors the repo convention (see longhorn-ingress.yaml): an HTTP→HTTPS      ║
# ║ redirect plus the HTTPS route, TLS via the shared wildcard cert.            ║
# ╚════════════════════════════════════════════════════════════════════════════╝
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: memos-http
  namespace: {{ .Release.Namespace }}
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`{{ .Values.app.host }}`)
      kind: Rule
      middlewares:
        - name: redirect-https
          namespace: traefik
          # WHY: shared redirect middleware, same one longhorn/argocd/grafana use.
      services:
        - name: memos
          port: 5230
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: memos-https
  namespace: {{ .Release.Namespace }}
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`{{ .Values.app.host }}`)
      kind: Rule
      services:
        - name: memos
          port: 5230
  tls:
    secretName: homehill-wildcard-tls
    # WHY: the *.homehill.de wildcard (issued by cert-manager into the traefik
    # ns, exposed via the default TLSStore). Same reference every other app uses.
{{- end }}
