# ╔══════════════════════════════════════════════════════════════════════╗
# ║  Pi-hole — FINAL home auf dovecote (Wyse 3040)                         ║
# ║  Nach Swarm-Teardown 2026-07-16: dovecote ist jetzt ein standalone     ║
# ║  Alpine-Host mit pristine Docker. Dies ist der dauerhafte Pi-hole,     ║
# ║  löst den Wegwerf-Interim auf barn ab.                                 ║
# ╚══════════════════════════════════════════════════════════════════════╝
services:
  pihole:
    container_name: pihole
    # WHY Digest-Pin statt :latest: immutable & nachvollziehbar (kein Jagen eines
    # beweglichen Tags). Aktuell: docker-Tag 2026.07.2 / Core v6.4.3 (2026-07-07).
    # Historie: startete auf 2025.11.0 / v6.2.2 (Teleporter-Backup-Stand),
    # am 2026-07-16 nach abgeschlossenem Umzug bewusst gebumpt.
    image: pihole/pihole@sha256:f7d1be836e3bc608b56d82fc9904f5a831cdfbc0dc9c6d58f94e4c985c70038b
    restart: unless-stopped
    # WHY host-Networking: dovecote hat Port 53 frei und KEINEN lokalen
    # Resolver (anders als barn mit systemd-resolved). Host-Mode ist hier das
    # Einfachste — 53 + Web-UI (:80) binden direkt auf den Host-Interfaces,
    # und FTL sieht die echten Client-IPs (kein docker-proxy-SNAT).
    network_mode: host
    environment:
      TZ: "Europe/Berlin"
      # KEIN FTLCONF_webserver_api_password hier — eine erzwungene Env-Variable
      # würde jedes in der Pi-hole-UI gesetzte Passwort bei jedem Neustart wieder
      # überschreiben. Das Passwort wird stattdessen IN Pi-hole gesetzt (Settings
      # bzw. `pihole setpassword`) und lebt in der pihole.toml → übersteht Restarts.
      # Sicherheitshalber "all" (harmlos in host-Mode); LAN-Clients kriegen
      # garantiert Antworten.
      FTLCONF_dns_listeningMode: "all"
    cap_add:
      - NET_ADMIN
    volumes:
      # Persistenz neben dem Compose. Überlebt Container-Restarts & Reboots.
      - ./etc-pihole:/etc/pihole
