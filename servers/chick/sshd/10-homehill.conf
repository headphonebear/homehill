# ╔════════════════════════════════════════════════════════════════════╗
# ║  chick — SSH hardening (homehill, 2026-10-24)                      ║
# ╚════════════════════════════════════════════════════════════════════╝
# WHY: bring-up left root login with a throwaway password open to the LAN.
# Admin path is now: key-login as coder, then `su -` (root pw in Vaultwarden)
# or `doas` for coder (/etc/doas.d/coder.conf). Console login is unaffected.
# Drop-in instead of editing sshd_config, so apk upgrades of openssh never
# collide with it. Rollback = delete this file + `rc-service sshd restart`.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no

# ╔════════════════════════════════════════════════════════════════════╗
# ║  mk3 — tunnel to chick-postgres, nothing else (2026-11-07)         ║
# ╚════════════════════════════════════════════════════════════════════╝
# WHY: mk3 (barn) reads the catalog via `ssh -N -L 5432:127.0.0.1:5432`.
# Postgres stays on 127.0.0.1; forwarding stays OFF for everyone else
# (stock sshd_config: AllowTcpForwarding no). Belt and braces with the
# `restrict,port-forwarding,permitopen=` options in ~mk3/.ssh/authorized_keys.
# Match must stay at the END of this file (it applies until EOF).
Match User mk3
    AllowTcpForwarding local
    PermitOpen 127.0.0.1:5432
    AllowAgentForwarding no
    AllowStreamLocalForwarding no
    X11Forwarding no
    PermitTunnel no
    PermitTTY no
    ForceCommand /sbin/nologin
